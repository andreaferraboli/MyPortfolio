            <i aria-hidden="true" class="bx bx-menu"></i>

</header>

<main class="container library" id="main">
    <div class="library__head">
        <h1 class="section-title">My Books</h1>
        <p aria-live="polite" class="library__count" id="books-count"></p>
    </div>

    <div class="library__layout">
        <aside aria-label="Filtri" class="library__filters">
            <details class="filters" id="filters" open>
                <summary class="filters__summary">
                    <span>Filtri</span>
                    <span class="filters__badge" id="filters-badge" hidden></span>
                    <i aria-hidden="true" class="bx bx-chevron-down"></i>
                </summary>
                <form class="filters__form" id="filters-form">
                    <fieldset class="filter-group">
                        <legend>Categoria</legend>
                        <div class="filter-group__list" id="categoriesDropdown"></div>
                    </fieldset>
                    <fieldset class="filter-group">
                        <legend>Autori</legend>
                        <div class="filter-group__list filter-group__list--scroll" id="authorsDropdown"></div>
                    </fieldset>
                    <fieldset class="filter-group">
                        <legend>Lingue</legend>
                        <div class="filter-group__list" id="languagesDropdown"></div>
                    </fieldset>
                    <div class="filters__actions">
                        <button class="btn" id="apply_button" type="submit">Apply</button>
                        <button class="btn btn--ghost" id="discard_button" type="button">Discard</button>
                    </div>
                </form>
            </details>
        </aside>

        <section aria-labelledby="books-count" class="book-grid" id="section-books"></section>
    </div>
</main>
